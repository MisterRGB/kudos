<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Compliment - Kudos Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- NAVIGATION HEADER -->
  <header class="max-w-2xl mx-auto flex justify-between items-center pb-6 mb-8 border-b border-slate-200">
    <div>
      <h1 class="text-xl font-bold text-slate-900">Kudos Portal</h1>
      <!-- Populated with student's email by JS upon session verification -->
      <p class="text-xs text-slate-500" id="user-display">Verifying session...</p>
    </div>
    <!-- Log Out Action Button -->
    <button onclick="handleLogout()" class="text-xs text-red-600 hover:underline">Log Out</button>
  </header>

  <!-- MAIN SUBMISSION FORM CONTAINER -->
  <main class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-lg font-semibold mb-4">Submit a Teacher Compliment</h2>

    <form onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- TEACHER SELECTION DROPDOWN -->
      <div>
        <label for="teacher-select" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Select Teacher</label>
        <select id="teacher-select" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <!-- Options dynamically injected from database by loadTeachers() -->
          <option value="">-- Loading teacher directory... --</option>
        </select>
      </div>

      <!-- PRAISE MESSAGE TEXTAREA -->
      <div>
        <label for="message" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Your Praise / Compliment</label>
        <textarea 
          id="message" 
          required 
          rows="5" 
          placeholder="What did this teacher do that made a positive difference?" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-emerald-700 transition">
        Submit Compliment for Review
      </button>
    </form>
  </main>

  <script>
    // ==========================================
    // SECTION 1: SUPABASE INITIALIZATION
    // ==========================================
    const SUPABASE_URL = 'https://eaulqdtjrqmnjgjgbzsp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WlWXdjjsWG96tB4_jTEkZw_v50g9k9g';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // SECTION 2: AUTH GUARD (PROTECTED PAGE)
    // ==========================================
    /**
     * Checks if the user is logged in.
     * Security logic: If NO active session is found in localStorage, redirect user to index.html.
     */
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (!session) {
        // Unauthenticated access blocked -> redirect back to login screen
        window.location.href = 'index.html';
      } else {
        // Authenticated access granted -> show email & fetch database content
        document.getElementById('user-display').textContent = `Logged in as: ${session.user.email}`;
        loadTeachers();
      }
    });

    // ==========================================
    // SECTION 3: READ OPERATION (FETCH TEACHERS)
    // ==========================================
    /**
     * Queries the 'teachers' database table and populates the <select> element.
     */
    async function loadTeachers() {
      // SQL Equivalent: SELECT id, name FROM teachers ORDER BY name ASC;
      const { data: teachers, error } = await supabaseClient
        .from('teachers')
        .select('id, name')
        .order('name');

      if (error) {
        alert('Failed to load teacher list: ' + error.message);
        return;
      }

      const selectEl = document.getElementById('teacher-select');
      selectEl.innerHTML = '<option value="">-- Choose a teacher --</option>';

      // Loop over array of returned teacher objects and construct HTML options
      teachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;        // Primary Key stored in value attribute
        opt.textContent = t.name; // Display name shown to student
        selectEl.appendChild(opt);
      });
    }

    // ==========================================
    // SECTION 4: CREATE OPERATION (INSERT COMPLIMENT)
    // ==========================================
    /**
     * Takes form input and inserts a new row into the 'compliments' table.
     */
    async function handleSubmit(event) {
      event.preventDefault();

      const teacherId = document.getElementById('teacher-select').value;
      const messageText = document.getElementById('message').value;

      // SQL Equivalent: INSERT INTO compliments (teacher_id, message) VALUES (teacherId, messageText);
      // Note: Column default in Supabase will set 'status' to 'pending' automatically.
      const { error } = await supabaseClient
        .from('compliments')
        .insert([{ teacher_id: teacherId, message: messageText }]);

      if (error) {
        alert('Error submitting compliment: ' + error.message);
      } else {
        alert('Success! Your compliment has been submitted for staff moderation.');
        document.getElementById('message').value = ''; // Reset form box
      }
    }

    // ==========================================
    // SECTION 5: LOGOUT HANDLER
    // ==========================================
    async function handleLogout() {
      await supabaseClient.auth.signOut(); // Revoke session tokens
      window.location.href = 'index.html'; // Redirect to login page
    }
  </script>
</body>
</html>
