<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderation Queue - Kudos Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- EmailJS SDK Initialization -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
       // Replace with your actual EmailJS Public Key
       emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
    })();
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- PAGE HEADER WITH LOGOUT -->
  <header class="max-w-3xl mx-auto flex justify-between items-center pb-6 mb-8 border-b border-slate-200">
    <div>
      <h1 class="text-xl font-bold text-slate-900">Moderation Dashboard</h1>
      <p class="text-xs text-slate-500" id="user-display">Verifying staff session...</p>
    </div>
    
    <div class="flex items-center gap-4">
      <span id="pending-count" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">0 Pending</span>
      <button onclick="handleLogout()" class="text-xs text-red-600 hover:underline font-medium">Log Out</button>
    </div>
  </header>

  <!-- MODERATION QUEUE DISPLAY AREA -->
  <main class="max-w-3xl mx-auto">
    <div id="queue-list" class="space-y-4">
      <p class="text-sm text-slate-400 italic">Loading moderation queue...</p>
    </div>
  </main>

  <script>
    // ==========================================
    // SECTION 1: SUPABASE INITIALIZATION
    // ==========================================
    const SUPABASE_URL = 'https://eaulqdtjrqmnjgjgbzsp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WlWXdjjsWG96tB4_jTEkZw_v50g9k9g';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Synchronized moderator list
    const AUTHORIZED_MODERATORS = [
      'mihsterb@gmail.com',
      '2023bermol@npghs.school.nz',
      'nbouterey@npghs.school.nz'
    ];

    // ==========================================
    // SECTION 2: AUTH & ROLE GUARD
    // ==========================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (!session) {
        window.location.href = 'index.html';
      } else {
        const userEmail = session.user.email.toLowerCase().trim();

        if (!AUTHORIZED_MODERATORS.includes(userEmail)) {
          alert('Access denied: You do not have moderator privileges.');
          window.location.href = 'submit.html';
        } else {
          document.getElementById('user-display').textContent = `Moderator: ${session.user.email}`;
          loadQueue();
        }
      }
    });

    // ==========================================
    // SECTION 3: FETCH PENDING QUEUE
    // ==========================================
    async function loadQueue() {
      const { data: pending, error } = await supabaseClient
        .from('compliments')
        .select('id, message, created_at, teachers(name, email)')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error fetching queue:', error.message);
        return;
      }

      const container = document.getElementById('queue-list');
      document.getElementById('pending-count').textContent = `${pending.length} Pending`;

      if (pending.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-400 italic text-sm">No pending compliments to review. Good job!</div>';
        return;
      }

      container.innerHTML = pending.map(item => {
        const teacherName = item.teachers?.name || 'Teacher';
        const teacherEmail = item.teachers?.email || '';
        // Escape quotes to prevent JavaScript string breaking inside onclick
        const safeMessage = item.message.replace(/'/g, "\\'").replace(/"/g, '&quot;');

        return `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-indigo-600 uppercase tracking-wide">To: ${teacherName} (${teacherEmail})</span>
              <span class="text-slate-400">${new Date(item.created_at).toLocaleDateString()}</span>
            </div>
            
            <p class="text-sm text-slate-700 italic bg-slate-50 p-3 rounded-lg border border-slate-100">"${item.message}"</p>
            
            <div class="flex gap-2 pt-1">
              <button onclick="approveAndSend('${item.id}', '${teacherEmail}', '${teacherName}', '${safeMessage}')" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-emerald-700 font-medium transition">
                Approve & Send
              </button>
              <button onclick="rejectKudos('${item.id}')" class="bg-red-50 text-red-600 text-xs px-3 py-1.5 rounded-lg hover:bg-red-100 font-medium transition">
                Reject
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // SECTION 4: APPROVE AND EMAIL ACTION
    // ==========================================
    async function approveAndSend(complimentId, teacherEmail, teacherName, messageText) {
      try {
        // A. Update Supabase Database
        const { error: dbError } = await supabaseClient
          .from('compliments')
          .update({ status: 'approved' })
          .eq('id', complimentId);

        if (dbError) throw dbError;

        // B. Send Email via EmailJS (if parameters configured)
        if (teacherEmail && teacherEmail.includes('@')) {
          const templateParams = {
            to_email: teacherEmail,
            teacher_name: teacherName,
            kudos_message: messageText
          };

          // Change SERVICE_ID and TEMPLATE_ID to match your EmailJS dashboard setup
          await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams);
        }

        alert(`Approved and sent to ${teacherName}!`);
        loadQueue(); // Refresh list

      } catch (err) {
        console.error('Error approving kudos:', err);
        alert('Failed to process approval: ' + err.message);
      }
    }

    // ==========================================
    // SECTION 5: REJECT ACTION
    // ==========================================
    async function rejectKudos(id) {
      const { error } = await supabaseClient
        .from('compliments')
        .update({ status: 'rejected' })
        .eq('id', id);

      if (error) {
        alert('Database update failed: ' + error.message);
      } else {
        loadQueue();
      }
    }

    // ==========================================
    // SECTION 6: LOGOUT HANDLER
    // ==========================================
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
