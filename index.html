<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login - Kudos Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

  <main class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Kudos Portal</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with your email to access the portal</p>
    </div>

    <!-- LOGIN FORM -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="student-email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">
          School or Moderator Email
        </label>
        <input 
          type="email" 
          id="student-email" 
          required 
          placeholder="user@school.ac.nz" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <button 
        id="submit-btn" 
        type="submit" 
        class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-indigo-700 transition"
      >
        Send Magic Login Link
      </button>
    </form>

    <div id="status-message" class="mt-4 p-3 rounded-lg text-xs font-mono hidden"></div>
  </main>

  <script>
    // ==========================================
    // SECTION 1: SUPABASE INITIALIZATION
    // ==========================================
    const SUPABASE_URL = 'https://eaulqdtjrqmnjgjgbzsp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WlWXdjjsWG96tB4_jTEkZw_v50g9k9g';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // SECTION 2: UI FEEDBACK HELPER
    // ==========================================
    function showStatus(msg, isError = false) {
      const el = document.getElementById('status-message');
      el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      el.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
      el.textContent = msg;
    }

    // ==========================================
    // SECTION 3: LOGIN FORM HANDLER
    // ==========================================
    async function handleLogin(event) {
      event.preventDefault();

      const btn = document.getElementById('submit-btn');
      const emailInput = document.getElementById('student-email').value.trim();

      btn.disabled = true;
      btn.textContent = 'Sending link...';

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: emailInput,
          options: {
            // REDIRECT TARGET: Must point back to index.html so the router below inspects the role!
            emailRedirectTo: 'https://misterrgb.github.io/kudos/index.html'
          }
        });

        if (error) {
          showStatus('Error: ' + error.message, true);
        } else {
          showStatus('Success! Check your email inbox for your magic login link.', false);
        }
      } catch (err) {
        showStatus('Unexpected Error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Magic Login Link';
      }
    }

    // ==========================================
    // SECTION 4: SMART AUTHENTICATION GUARD & ROUTER
    // ==========================================
    const AUTHORIZED_MODERATORS = [
      'mihsterb@gmail.com',
      '2023bermol@npghs.school.nz',
      'nbouterey@npghs.school.nz'
    ];

    /**
     * Handles all routing automatically.
     * Supabase triggers this on page load AND after magic link tokens are parsed.
     */
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        const userEmail = session.user.email.toLowerCase().trim();
        console.log("Authenticated User:", userEmail);

        if (AUTHORIZED_MODERATORS.includes(userEmail)) {
          console.log("Access granted: Redirecting to moderate.html");
          window.location.href = 'moderate.html';
        } else {
          console.log("Standard access: Redirecting to submit.html");
          window.location.href = 'submit.html';
        }
      }
    });
  </script>
</body>
</html>
