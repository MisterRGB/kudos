<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Compliment Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <header class="max-w-3xl mx-auto flex justify-between items-center pb-6 mb-8 border-b border-slate-200">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Kudos Portal</h1>
      <p class="text-sm text-slate-500">Send a compliment to your teachers</p>
    </div>
    <div id="auth-status" class="text-right">
      <span id="user-email-display" class="text-xs text-slate-500 block mb-1">Not logged in</span>
      <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs text-red-600 hover:underline">Log Out</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto space-y-8">

    <!-- LOGIN FORM -->
    <section id="auth-section" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-2">Student Login</h2>
      <p class="text-sm text-slate-600 mb-4">Enter your school email to receive a Magic Login Link.</p>
      
      <form onsubmit="handleMagicLinkLogin(event)" class="space-y-4">
        <div>
          <label for="student-email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
          <input 
            type="email" 
            id="student-email" 
            required 
            placeholder="your-email@school.ac.nz" 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <button id="submit-btn" type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-indigo-700 transition">
          Send Magic Login Link
        </button>
      </form>

      <!-- Status Display Box -->
      <div id="status-message" class="mt-4 p-3 rounded-lg text-xs font-mono hidden"></div>
    </section>

    <!-- COMPLIMENT FORM -->
    <section id="compliment-section" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4">Submit a Compliment</h2>
      <form onsubmit="handleComplimentSubmit(event)" class="space-y-4">
        <div>
          <label for="teacher-select" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Select Teacher</label>
          <select id="teacher-select" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">-- Choose a teacher --</option>
          </select>
        </div>
        <div>
          <label for="compliment-message" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Your Compliment</label>
          <textarea id="compliment-message" required rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-emerald-700 transition">
          Submit for Moderation
        </button>
      </form>
    </section>

    <!-- MODERATION QUEUE -->
    <section id="moderation-section" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Moderation Queue</h2>
        <span id="pending-count" class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded-full font-medium">0 Pending</span>
      </div>
      <div id="moderation-list" class="space-y-4">
        <p class="text-sm text-slate-400 italic">Loading pending compliments...</p>
      </div>
    </section>

  </main>

  <script>
  const SUPABASE_URL = 'https://eaulqdtjrqmnjgjgbzsp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WlWXdjjsWG96tB4_jTEkZw_v50g9k9g';

  // FIX: Name the client 'supabaseClient' instead of 'supabase' to prevent naming conflicts
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status-message');
    el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
    if (isError) {
      el.classList.add('bg-red-100', 'text-red-700');
    } else {
      el.classList.add('bg-green-100', 'text-green-700');
    }
    el.textContent = msg;
  }

  async function handleMagicLinkLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('submit-btn');
    const email = document.getElementById('student-email').value;

    btn.disabled = true;
    btn.textContent = 'Contacting Supabase...';
    showStatus('Sending request to Supabase...', false);

    try {
      const { data, error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: 'https://misterrgb.github.io/kudos/'
        }
      });

      if (error) {
        showStatus('SUPABASE ERROR: ' + error.message, true);
      } else {
        showStatus('SUCCESS! Magic link sent. Check your inbox (and spam folder).', false);
      }
    } catch (err) {
      showStatus('NETWORK/JS ERROR: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Magic Login Link';
    }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.reload();
  }

  async function loadTeachers() {
    const { data: teachers, error } = await supabaseClient.from('teachers').select('id, name').order('name');
    if (error) return;
    const selectEl = document.getElementById('teacher-select');
    selectEl.innerHTML = '<option value="">-- Choose a teacher --</option>';
    teachers.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      selectEl.appendChild(opt);
    });
  }

  async function handleComplimentSubmit(event) {
    event.preventDefault();
    const teacherId = document.getElementById('teacher-select').value;
    const message = document.getElementById('compliment-message').value;
    const { error } = await supabaseClient.from('compliments').insert([{ teacher_id: teacherId, message: message }]);
    if (error) {
      alert('Failed: ' + error.message);
    } else {
      alert('Submitted for moderation!');
      document.getElementById('compliment-message').value = '';
    }
  }

  async function loadModerationQueue() {
    const { data: pending, error } = await supabaseClient
      .from('compliments')
      .select('id, message, created_at, teachers(name, email)')
      .eq('status', 'pending');
    if (error) return;

    const container = document.getElementById('moderation-list');
    document.getElementById('pending-count').textContent = `${pending.length} Pending`;
    if (pending.length === 0) {
      container.innerHTML = '<p class="text-sm text-slate-400 italic">No pending compliments.</p>';
      return;
    }
    container.innerHTML = pending.map(item => `
      <div class="border border-slate-200 rounded-lg p-4 bg-slate-50 space-y-2">
        <span class="text-xs font-bold text-indigo-600 uppercase">To: ${item.teachers?.name || 'Teacher'}</span>
        <p class="text-sm text-slate-700 italic">"${item.message}"</p>
        <div class="flex gap-2 pt-2">
          <button onclick="updateStatus('${item.id}', 'approved')" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded">Approve & Email</button>
          <button onclick="updateStatus('${item.id}', 'rejected')" class="bg-red-100 text-red-600 text-xs px-3 py-1.5 rounded">Reject</button>
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(id, newStatus) {
    const { error } = await supabaseClient.from('compliments').update({ status: newStatus }).eq('id', id);
    if (error) alert(error.message);
    else loadModerationQueue();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    const authSection = document.getElementById('auth-section');
    const complimentSection = document.getElementById('compliment-section');
    const moderationSection = document.getElementById('moderation-section');
    const userDisplay = document.getElementById('user-email-display');
    const logoutBtn = document.getElementById('logout-btn');

    if (session) {
      authSection.classList.add('hidden');
      complimentSection.classList.remove('hidden');
      moderationSection.classList.remove('hidden');
      userDisplay.textContent = session.user.email;
      logoutBtn.classList.remove('hidden');
      loadTeachers();
      loadModerationQueue();
    } else {
      authSection.classList.remove('hidden');
      complimentSection.classList.add('hidden');
      moderationSection.classList.add('hidden');
      userDisplay.textContent = 'Not logged in';
      logoutBtn.classList.add('hidden');
    }
  });
</script>
</body>
</html>
