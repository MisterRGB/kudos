<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login - Kudos Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

  <main class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Kudos Portal</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with your school email to send a compliment</p>
    </div>

    <!-- LOGIN FORM -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="student-email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">School Email</label>
        <input 
          type="email" 
          id="student-email" 
          required 
          placeholder="student@school.ac.nz" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <button id="submit-btn" type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg text-sm hover:bg-indigo-700 transition">
        Send Magic Login Link
      </button>
    </form>

    <!-- STATUS DISPLAY BOX -->
    <div id="status-message" class="mt-4 p-3 rounded-lg text-xs font-mono hidden"></div>
  </main>

  <script>
  const SUPABASE_URL = 'https://eaulqdtjrqmnjgjgbzsp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_WlWXdjjsWG96tB4_jTEkZw_v50g9k9g';

  // Instantiate client with supabaseClient to avoid variable collision
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status-message');
    el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
    el.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    el.textContent = msg;
  }

  async function handleLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('submit-btn');
    const email = document.getElementById('student-email').value;

    btn.disabled = true;
    btn.textContent = 'Sending link...';

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          // Redirect straight to the submission form after login click
          emailRedirectTo: 'https://misterrgb.github.io/kudos/submit.html'
        }
      });

      if (error) showStatus('Error: ' + error.message, true);
      else showStatus('Success! Check your inbox for the magic link.', false);
    } catch (err) {
      showStatus('Error: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Magic Login Link';
    }
  }

  // AUTH GUARD: If already logged in, skip login page and go straight to submission form
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      window.location.href = 'submit.html';
    }
  });
</script>
</body>
</html>
